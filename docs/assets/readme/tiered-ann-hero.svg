<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Seconds-Rule Tiered ANN</title>
  <desc id="desc">A visual map of IVF lists moving between DRAM and SSD under six cache policies</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.55" stop-color="#102445"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49d6ff"/>
      <stop offset="1" stop-color="#7cf7d4"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb86c"/>
      <stop offset="1" stop-color="#ff718a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="48" r="170" fill="#49d6ff" opacity="0.05"/>
  <circle cx="110" cy="410" r="210" fill="#ff718a" opacity="0.05"/>

  <g transform="translate(68 58)">
    <rect width="664" height="304" rx="24" fill="#0d1b31" stroke="#2b466d"/>
    <text x="34" y="54" fill="#7cf7d4" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">REPRODUCIBLE SYSTEMS STUDY</text>
    <text x="34" y="112" fill="#f4f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="45" font-weight="750">Seconds-Rule Tiered ANN</text>
    <text x="34" y="150" fill="#a9bad3" font-family="Segoe UI, Arial, sans-serif" font-size="21">IVF caching across DRAM and SSD</text>

    <g transform="translate(34 184)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">
      <rect width="112" height="38" rx="19" fill="#173a4e" stroke="#49d6ff"/>
      <text x="56" y="25" text-anchor="middle" fill="#c8f5ff">6 policies</text>
      <rect x="126" width="122" height="38" rx="19" fill="#173a4e" stroke="#7cf7d4"/>
      <text x="187" y="25" text-anchor="middle" fill="#d9fff2">5 workloads</text>
      <rect x="262" width="122" height="38" rx="19" fill="#3b2635" stroke="#ffb86c"/>
      <text x="323" y="25" text-anchor="middle" fill="#ffe6c6">p95 + IOAmp</text>
      <rect x="398" width="150" height="38" rx="19" fill="#3b2635" stroke="#ff718a"/>
      <text x="473" y="25" text-anchor="middle" fill="#ffd8df">migration cost</text>
    </g>

    <text x="34" y="273" fill="#7188a8" font-family="Consolas, monospace" font-size="15">Faiss IVF-Flat · SIFT1M · Python · Apache-2.0</text>
  </g>

  <g transform="translate(770 58)" filter="url(#shadow)">
    <rect width="362" height="304" rx="24" fill="#0b182b" stroke="#2b466d"/>
    <text x="28" y="38" fill="#8fa6c6" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">IVF LIST RESIDENCY</text>

    <g transform="translate(28 63)">
      <rect width="306" height="78" rx="16" fill="#123b45" stroke="#49d6ff"/>
      <text x="24" y="31" fill="#7cf7d4" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">DRAM · HOT LISTS</text>
      <rect x="24" y="45" width="50" height="12" rx="6" fill="#49d6ff"/>
      <rect x="84" y="45" width="72" height="12" rx="6" fill="#7cf7d4"/>
      <rect x="166" y="45" width="38" height="12" rx="6" fill="#49d6ff"/>
      <rect x="214" y="45" width="64" height="12" rx="6" fill="#7cf7d4"/>
    </g>

    <g transform="translate(28 173)">
      <rect width="306" height="78" rx="16" fill="#392838" stroke="#ff718a"/>
      <text x="24" y="31" fill="#ffb86c" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">SSD · COLD LISTS</text>
      <rect x="24" y="45" width="78" height="12" rx="6" fill="#ffb86c"/>
      <rect x="112" y="45" width="42" height="12" rx="6" fill="#ff718a"/>
      <rect x="164" y="45" width="69" height="12" rx="6" fill="#ffb86c"/>
      <rect x="243" y="45" width="35" height="12" rx="6" fill="#ff718a"/>
    </g>

    <path d="M119 151h114" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round"/>
    <path d="m224 142 13 9-13 9" fill="none" stroke="#7cf7d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M233 163H119" stroke="url(#amber)" stroke-width="5" stroke-linecap="round"/>
    <path d="m128 154-13 9 13 9" fill="none" stroke="#ffb86c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="181" y="287" text-anchor="middle" fill="#7188a8" font-family="Segoe UI, Arial, sans-serif" font-size="13">rebalance · measure · compare</text>
  </g>
</svg>
