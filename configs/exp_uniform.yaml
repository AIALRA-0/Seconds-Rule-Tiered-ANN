project:
  results_root: "results"
  run_name: "sr_sift_exp_uniform_fast"   # Change the name to avoid overwrite

data:
  dataset: "sift1m"
  sift1m_dir: "data/sift1m"

  # Also reduce a bit here; still enough to see trends
  num_base: 50000          # Previously 100000
  num_queries: 500         # Previously 1000
  dim: 128
  query_shuffle: true
  query_sample_without_replacement: true

index:
  type: "ivf_flat"
  metric: "l2"
  k: 10
  nlist: 64

  # Keep only 3 nprobes, roughly covering small / medium / large
  nprobe_candidates: [1, 2, 4, 8, 16, 32]   # Previously [1, 2, 4, 8, 16, 32]

  faiss_num_threads: 4
  train_seed: 1234

tier:
  page_size_bytes: 4096
  dram_access_us_per_list: 0.2
  ssd_base_lat_us_per_page: 20.0

  # Two DRAM corner points are enough to see trends
  dram_fraction_list: [0.05, 0.1, 0.2]          # Previously [0.05, 0.1, 0.2]

  # Fix IOPS to a single (middle) value for now
  max_iops_list: [5000000]                 # Previously [1000000, 5000000, 10000000]

  migration_count_eviction: true

policy:
  enabled_policies:
    - "all_dram"
    - "all_ssd"
    - "naive_lfu"
    - "lru"
    - "window_lfu"
    - "seconds_rule"

  rebalance_interval: 200

  window_lfu:
    window_size_queries: 5000

  seconds_rule:
    alpha: 0.1
    recency_weight: 0.3
    t_star_seconds: 3.0
    assumed_qps_for_tstar: 10000.0

plot:
  enable: true
  errorbar: "ci95"
  figures:
    - "p95_vs_dram"
    - "io_amp_vs_dram"
    - "migration_vs_dram"
    - "sla_reachable_recall"
    - "recall_latency_frontier"
    # Remove p95_vs_iops for now because IOPS has only one point, so the plot would not be very meaningful

experiment:
  seeds: [0, 1, 2]             # Single seed is enough
  slas_us: [200.0, 500.0]

  export_metrics:
    - "avg_latency_us"
    - "p50_latency_us"
    - "p95_latency_us"
    - "p99_latency_us"
    - "qps_from_avg_latency"
    - "avg_ssd_pages"
    - "avg_ssd_bytes"
    - "avg_io_amplification"
    - "total_migration_bytes"
    - "migration_bytes_per_query"
    - "avg_migrated_clusters_per_rebalance"
    - "total_migration_time_us"
    - "migration_time_us_per_query"

  workload: "uniform"

  # Lower the number of requests to around 20k–50k is sufficient
  workload_num_requests: 20000    # Previously 200000
