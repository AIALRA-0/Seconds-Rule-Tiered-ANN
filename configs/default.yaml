project:
  results_root: "results"
  run_name: "sr_sift_default_fast"

data:
  dataset: "sift1m"
  sift1m_dir: "data/sift1m"
  num_base: 20000          # Originally 100000 → directly cut down to 20k
  num_queries: 2000        # Originally 10000 → cut down to 2000
  dim: 128
  query_shuffle: true
  query_sample_without_replacement: true

index:
  type: "ivf_flat"
  metric: "l2"
  k: 10
  nlist: 64
  nprobe_candidates: [1, 4, 16]   # Removed 2/8/32, keep only three points: small/medium/large
  faiss_num_threads: 4
  train_seed: 1234

tier:
  page_size_bytes: 4096
  dram_access_us_per_list: 0.2
  ssd_base_lat_us_per_page: 20.0
  dram_fraction_list: [0.05, 0.2]   # Only look at two points: “very tight” and “relatively loose”
  max_iops_list: [1000000, 5000000] # Keep only the 1M and 5M tiers
  migration_count_eviction: true

policy:
  enabled_policies:
    - "all_dram"
    - "all_ssd"
    - "naive_lfu"
    - "lru"
    - "window_lfu"
    - "seconds_rule"

  rebalance_interval: 200

  window_lfu:
    window_size_queries: 5000

  seconds_rule:
    alpha: 0.1
    recency_weight: 0.3
    t_star_seconds: 3.0
    assumed_qps_for_tstar: 10000.0

plot:
  enable: true
  errorbar: "ci95"
  figures:
    - "p95_vs_dram"
    - "p95_vs_iops"
    - "io_amp_vs_dram"
    - "migration_vs_dram"
    - "sla_reachable_recall"
    - "recall_latency_frontier"

experiment:
  seeds: [0]                  # Single seed is enough to see trends
  slas_us: [200.0, 500.0]

  export_metrics:
    - "avg_latency_us"
    - "p50_latency_us"
    - "p95_latency_us"
    - "p99_latency_us"
    - "qps_from_avg_latency"
    - "avg_ssd_pages"
    - "avg_ssd_bytes"
    - "avg_io_amplification"
    - "total_migration_bytes"
    - "migration_bytes_per_query"
    - "avg_migrated_clusters_per_rebalance"
    - "total_migration_time_us"
    - "migration_time_us_per_query"

  workload: "default"
  workload_num_requests: 20000   # If it used to be on the order of 200000, it can be cut down to 20k
